<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desafio de Raciocínio Lógico</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 10px;
    }

    p {
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background-color: var(--primary);
      color: #0f172a;
      font-weight: bold;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      color: #fff;
    }

    .btn-option {
      background-color: #334155;
      color: var(--text);
      text-align: left;
    }

    .btn-option:hover {
      background-color: #475569;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      background-color: #0f172a;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .question-box {
      font-size: 1.2rem;
      margin-bottom: 20px;
      min-height: 50px;
    }

    .hidden {
      display: none;
    }

    .feedback {
      margin-top: 15px;
      font-weight: bold;
      height: 20px;
    }

    .correct { color: var(--success); }
    .wrong { color: var(--danger); }
  </style>
</head>
<body>

  <div class="container">
    <!-- TELA INICIAL -->
    <div id="screen-welcome">
      <h1>Desafio Lógico</h1>
      <p>Escolha a dificuldade para começar:</p>
      <div class="btn-group">
        <button class="btn" onclick="startGame('facil')">Fácil</button>
        <button class="btn" onclick="startGame('medio')">Médio</button>
        <button class="btn" onclick="startGame('dificil')">Difícil</button>
      </div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="screen-game" class="hidden">
      <div class="status-bar">
        <span>Fase: <strong id="lbl-phase">1/3</strong></span>
        <span>Pontos: <strong id="lbl-score">0</strong></span>
        <span>Tempo: <strong id="lbl-timer">30s</strong></span>
      </div>

      <h3 id="phase-title" style="color: var(--primary); margin-bottom: 10px;"></h3>
      <div class="question-box" id="lbl-question"></div>
      <div class="btn-group" id="options-container"></div>
      <div class="feedback" id="lbl-feedback"></div>
    </div>

    <!-- TELA FINAL -->
    <div id="screen-end" class="hidden">
      <h1>Fim de Jogo!</h1>
      <p id="final-message"></p>
      <h2 id="final-score" style="color: var(--primary); margin-bottom: 20px;">0 pts</h2>
      <button class="btn" onclick="resetGame()">Jogar Novamente</button>
    </div>
  </div>

  <script>
    const questionsDatabase = {
      1: {
        title: "Fase 1: Sequências Lógicas",
        facil: [
          { q: "Qual o próximo número: 2, 4, 6, 8, ?", options: ["9", "10", "12", "14"], answer: 1 },
          { q: "Qual o próximo número: 5, 10, 15, 20, ?", options: ["22", "25", "30", "35"], answer: 1 }
        ],
        medio: [
          { q: "Qual o próximo número: 3, 6, 12, 24, ?", options: ["30", "48", "36", "42"], answer: 1 },
          { q: "Sequência de Fibonacci: 1, 1, 2, 3, 5, ?", options: ["7", "8", "9", "10"], answer: 1 }
        ],
        dificil: [
          { q: "Próximo número primo: 2, 3, 5, 7, 11, ?", options: ["12", "13", "15", "17"], answer: 1 },
          { q: "Quadrados perfeitos: 1, 4, 9, 16, 25, ?", options: ["30", "36", "49", "64"], answer: 1 }
        ]
      },
      2: {
        title: "Fase 2: Enigmas & Dedução",
        facil: [
          { q: "Se A é maior que B, e B é maior que C, quem é o menor?", options: ["A", "B", "C", "Iguais"], answer: 2 },
          { q: "Tenho 3 maçãs e tiro 2. Com quantas fico?", options: ["1", "2", "3", "0"], answer: 1 }
        ],
        medio: [
          { q: "Se a afirmação (A E B) é Verdadeira, qual é o valor de A?", options: ["Verdadeiro", "Falso", "Indeterminado", "Nulo"], answer: 0 },
          { q: "Alguns meses têm 30 dias, outros 31. Quantos têm 28 dias?", options: ["1", "2", "Todos", "Nenhum"], answer: 2 }
        ],
        dificil: [
          { q: "Se NÃO(A OU B) é Verdadeiro e A é Falso, qual o valor de B?", options: ["Verdadeiro", "Falso", "Indefinido", "Nulo"], answer: 1 },
          { q: "Ao ultrapassar o 2º colocado numa corrida, você fica em qual posição?", options: ["1º", "2º", "3º", "Último"], answer: 1 }
        ]
      },
      3: {
        title: "Fase 3: Expressões Lógicas",
        facil: [
          { q: "Resultado de: 2 + 3 * 4", options: ["20", "14", "18", "24"], answer: 1 },
          { q: "Resultado de: 15 - (2 + 3)", options: ["10", "8", "12", "5"], answer: 0 }
        ],
        medio: [
          { q: "Se X + X = 10 e X * Y = 20, quanto vale Y?", options: ["2", "4", "5", "10"], answer: 1 },
          { q: "Resultado de: 2³ + 4", options: ["10", "12", "16", "14"], answer: 1 }
        ],
        dificil: [
          { q: "Se a operação X ⊕ Y significa (X² + Y), quanto é 3 ⊕ 4?", options: ["10", "13", "15", "25"], answer: 1 },
          { q: "Se f(x) = 2x + 3, qual o valor de f(f(2))?", options: ["14", "17", "19", "21"], answer: 1 }
        ]
      }
    };

    let currentDifficulty = 'facil';
    let currentPhase = 1;
    let currentQuestionIndex = 0;
    let score = 0;
    let timer = null;
    let timeLeft = 0;

    const timeLimits = { facil: 30, medio: 20, dificil: 12 };

    function startGame(difficulty) {
      currentDifficulty = difficulty;
      currentPhase = 1;
      currentQuestionIndex = 0;
      score = 0;

      document.getElementById('screen-welcome').classList.add('hidden');
      document.getElementById('screen-end').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');

      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timer);
      document.getElementById('lbl-feedback').innerText = "";
      
      const phaseData = questionsDatabase[currentPhase];
      const questionsList = phaseData[currentDifficulty];

      if (currentQuestionIndex >= questionsList.length) {
        if (currentPhase < 3) {
          currentPhase++;
          currentQuestionIndex = 0;
          loadQuestion();
          return;
        } else {
          endGame();
          return;
        }
      }

      document.getElementById('lbl-phase').innerText = `${currentPhase}/3`;
      document.getElementById('lbl-score').innerText = score;
      document.getElementById('phase-title').innerText = phaseData.title;

      const qData = questionsList[currentQuestionIndex];
      document.getElementById('lbl-question').innerText = qData.q;

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = "";

      qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "btn btn-option";
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      timeLeft = timeLimits[currentDifficulty];
      document.getElementById('lbl-timer').innerText = `${timeLeft}s`;

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('lbl-timer').innerText = `${timeLeft}s`;

        if (timeLeft <= 0) {
          clearInterval(timer);
          selectAnswer(-1);
        }
      }, 1000);
    }

    function selectAnswer(index) {
      clearInterval(timer);
      const qData = questionsDatabase[currentPhase][currentDifficulty][currentQuestionIndex];
      const feedback = document.getElementById('lbl-feedback');

      if (index === qData.answer) {
        score += (currentDifficulty === 'dificil' ? 30 : currentDifficulty === 'medio' ? 20 : 10);
        feedback.innerText = "Correto!";
        feedback.className = "feedback correct";
      } else {
        feedback.innerText = index === -1 ? "Tempo Esgotado!" : "Incorreto!";
        feedback.className = "feedback wrong";
      }

      document.getElementById('lbl-score').innerText = score;

      setTimeout(() => {
        currentQuestionIndex++;
        loadQuestion();
      }, 1000);
    }

    function endGame() {
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-end').classList.remove('hidden');

      document.getElementById('final-score').innerText = `${score} pts`;
      document.getElementById('final-message').innerText = 
        score >= 120 ? "Excelente raciocínio!" :
        score >= 60 ? "Bom resultado!" :
        "Continue treinando para melhorar!";
    }

    function resetGame() {
      document.getElementById('screen-end').classList.add('hidden');
      document.getElementById('screen-welcome').classList.remove('hidden');
    }
  </script>
</body>
</html>
